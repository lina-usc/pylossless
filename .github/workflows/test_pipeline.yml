name: Test pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs at Midnight UTC every day
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable ssh debugging'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: ${{ matrix.os }} · Python 3.11
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest # arm64 (Apple Silicon)
          - windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get commit message
        shell: bash
        run: |
          commit_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          commit_message="$(git show -s --format=%s "${commit_sha}" 2>/dev/null || git show -s --format=%s HEAD)"
          echo "Commit SHA: ${commit_sha}"
          echo "Commit message: ${commit_message}"
          echo "COMMIT_MESSAGE=${commit_message}" | tee -a "${GITHUB_ENV}"
      - name: Triage SSH
        shell: bash
        run: |
          if [[ "${{ inputs.ssh }}" == "true" ]] || [[ "${COMMIT_MESSAGE}" == *"[actions ssh]"* ]]; then
            echo "ENABLE_SSH=true" | tee -a "${GITHUB_ENV}"
          else
            echo "ENABLE_SSH=false" | tee -a "${GITHUB_ENV}"
          fi
      - name: Setup Remote SSH Connection
        if: env.ENABLE_SSH == 'true'
        uses: Warpbuilds/action-debugger@v1.3
        timeout-minutes: 80
        with:
          detached: true
          limit-access-to-actor: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Pylossless & Deps
        run: |
          pip install -e .
          pip install onnxruntime  # Needed for MNE-ICALabel
      - name: Test import
        run: |
          python -c "import pylossless"
      - name: Install testing dependencies
        run: pip install -r requirements_testing.txt
      - name: Install QC depedencies
        run: pip install -r requirements_qc.txt
      - name: Test Pipeline
        run: |
          coverage run -m pytest
      - name: Test example notebooks
        run: |
          pip install nbmake
          pytest --nbmake notebooks  
      - name: Upload coverage to codecov (Only do this for the ubuntu-latest job)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  test-macos-intel:
    name: macOS 15 Intel · conda-forge
    runs-on: macos-15-intel

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yaml
          cache-environment: true
      - name: Install Pylossless
        run: python -m pip install --no-deps -e .
      - name: Test import
        run: python -c "import pylossless"
      - name: Test Pipeline
        run: python -m pytest pylossless/ --ignore=pylossless/dash

