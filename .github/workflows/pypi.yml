name: Release

# Publish a GitHub release with the tag "v<version>" to upload that version to
# PyPI. The tag must match the version in setup.py. Pull requests and pushes to
# main only build and check the package.
# PyPI's trusted publisher is bound to this filename. Do not rename it.
on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: check that the wheel installs and imports
        env:
          # CPU-only torch, to avoid downloading the CUDA wheels
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "import pylossless"
      - name: check that the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd /tmp
          /tmp/venv/bin/python -c "import os; from importlib.metadata import version; v = version('pylossless'); assert 'v' + v == os.environ['TAG'], v"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pylossless
    permissions:
      # PyPI trusted publishing uses an OpenID Connect token, not a password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
